[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hsk-registration"
version = "0.1.0"
description = "HSK pre-registration and staff verification prototype"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.142.2",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.1",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]
